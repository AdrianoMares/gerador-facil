<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Como funciona a Malha Fina do Imposto de Renda</title>
  <desc id="desc">Infográfico em cinco etapas: declaração enviada, cruzamento de dados, pendência identificada, análise da Receita e regularização.</desc>
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF8F5"/><stop offset="1" stop-color="#F7FBFC"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13A37F"/><stop offset="1" stop-color="#0A8E75"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0E3150" flood-opacity="0.09"/></filter>
    <style>
      .navy{fill:#0F3557}.teal{fill:#0C9C7B}.gray{fill:#4E657A}.card{fill:#F7FBFC}.num{fill:#0D9F7D}.title{font:700 26px Arial,sans-serif;fill:#10385C}.body{font:400 18px Arial,sans-serif;fill:#4E657A}.small{font:400 16px Arial,sans-serif;fill:#4E657A}.label{font:700 20px Arial,sans-serif;fill:#10385C}
    </style>
  </defs>
  <rect width="1672" height="941" fill="#FFFFFF"/>
  <path d="M0 0h360c-78 33-135 82-202 139C96 191 45 204 0 210z" fill="#0F3557"/>
  <path d="M0 188c92-20 173-73 256-173" fill="none" stroke="#11A587" stroke-width="4"/>
  <circle cx="1535" cy="0" r="190" fill="#EAF8F5"/>

  <g transform="translate(626 30)">
    <rect x="0" y="24" width="14" height="38" rx="2" fill="#0C9C7B"/><rect x="20" y="14" width="14" height="48" rx="2" fill="#0A8874"/><rect x="40" y="2" width="14" height="60" rx="2" fill="#0F3557"/>
    <text x="72" y="58" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#0F3557">Resodi</text>
    <line x1="275" y1="10" x2="275" y2="66" stroke="#BFD2DC" stroke-width="2"/>
    <text x="298" y="25" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#0F3557">RESOLVA SERVIÇOS</text>
    <text x="298" y="46" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#0F3557">DIGITAIS</text>
  </g>

  <text x="836" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#0F3557">Como funciona a</text>
  <text x="836" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="66" font-weight="700" fill="#0C9C7B">Malha Fina do Imposto de Renda</text>
  <text x="836" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#31516D">Entenda o que acontece quando a declaração cai em análise e como regularizar.</text>

  <!-- Cards -->
  <g filter="url(#shadow)">
    <rect x="45" y="330" width="270" height="350" rx="28" class="card"/>
    <rect x="365" y="330" width="270" height="350" rx="28" class="card"/>
    <rect x="685" y="330" width="270" height="350" rx="28" class="card"/>
    <rect x="1005" y="330" width="270" height="350" rx="28" class="card"/>
    <rect x="1325" y="330" width="300" height="350" rx="28" class="card"/>
  </g>

  <!-- Step 1 -->
  <circle cx="78" cy="352" r="28" class="num"/><text x="78" y="362" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">1</text>
  <g transform="translate(125 370)" stroke="#0F3557" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="74" height="92" rx="7"/><line x1="15" y1="24" x2="58" y2="24"/><line x1="15" y1="46" x2="52" y2="46"/><line x1="15" y1="68" x2="44" y2="68"/><circle cx="67" cy="77" r="22" fill="#0C9C7B" stroke="#fff" stroke-width="5"/><path d="M57 77l7 8 14-17" stroke="#fff"/></g>
  <text x="180" y="500" text-anchor="middle" class="title"><tspan x="180">Declaração</tspan><tspan x="180" dy="30">enviada</tspan></text>
  <text x="180" y="558" text-anchor="middle" class="body"><tspan x="180">Você envia sua</tspan><tspan x="180" dy="24">declaração de</tspan><tspan x="180" dy="24">Imposto de Renda</tspan><tspan x="180" dy="24">dentro do prazo.</tspan></text>

  <!-- Step 2 -->
  <circle cx="398" cy="352" r="28" class="num"/><text x="398" y="362" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">2</text>
  <g transform="translate(470 380)"><ellipse cx="30" cy="12" rx="46" ry="15" fill="#0F3557"/><path d="M-16 12v62c0 9 21 16 46 16s46-7 46-16V12" fill="#0F3557"/><path d="M-15 35c25 17 66 17 90 0M-15 58c25 17 66 17 90 0" fill="none" stroke="#fff" stroke-width="6"/><circle cx="75" cy="76" r="22" fill="#0C9C7B" stroke="#fff" stroke-width="5"/><path d="M65 76l7 8 14-17" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="500" y="500" text-anchor="middle" class="title"><tspan x="500">Cruzamento</tspan><tspan x="500" dy="30">de dados</tspan></text>
  <text x="500" y="558" text-anchor="middle" class="body"><tspan x="500">A Receita Federal</tspan><tspan x="500" dy="24">compara informações</tspan><tspan x="500" dy="24">da declaração com</tspan><tspan x="500" dy="24">outras fontes.</tspan></text>

  <!-- Step 3 -->
  <circle cx="718" cy="352" r="28" class="num"/><text x="718" y="362" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">3</text>
  <g transform="translate(782 374)" fill="none" stroke="#0C9C7B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M44 0L92 88H-4z"/><line x1="44" y1="28" x2="44" y2="58"/><circle cx="44" cy="73" r="4" fill="#0C9C7B"/></g>
  <text x="820" y="500" text-anchor="middle" class="title"><tspan x="820">Pendência</tspan><tspan x="820" dy="30">identificada</tspan></text>
  <text x="820" y="558" text-anchor="middle" class="body"><tspan x="820">Se houver divergências</tspan><tspan x="820" dy="24">ou inconsistências,</tspan><tspan x="820" dy="24">a declaração pode ficar</tspan><tspan x="820" dy="24">retida para análise.</tspan></text>

  <!-- Step 4 -->
  <circle cx="1038" cy="352" r="28" class="num"/><text x="1038" y="362" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">4</text>
  <g transform="translate(1122 390)" fill="none" stroke="#0F3557" stroke-width="8" stroke-linecap="round"><circle cx="0" cy="0" r="44"/><line x1="31" y1="31" x2="70" y2="70"/><path d="M-18 -5a22 22 0 0 1 20-17" stroke="#0C9C7B"/></g>
  <text x="1140" y="500" text-anchor="middle" class="title"><tspan x="1140">Análise da</tspan><tspan x="1140" dy="30">Receita</tspan></text>
  <text x="1140" y="558" text-anchor="middle" class="body"><tspan x="1140">A Receita Federal</tspan><tspan x="1140" dy="24">avalia as informações</tspan><tspan x="1140" dy="24">e pode solicitar</tspan><tspan x="1140" dy="24">documentos.</tspan></text>

  <!-- Step 5 -->
  <circle cx="1358" cy="352" r="28" class="num"/><text x="1358" y="362" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">5</text>
  <g transform="translate(1444 370)" fill="none" stroke="#0F3557" stroke-width="8" stroke-linejoin="round"><path d="M0 0l48 20v43c0 31-20 55-48 69-28-14-48-38-48-69V20z"/><path d="M-20 59l15 16 30-34" stroke="#0C9C7B" stroke-width="10" stroke-linecap="round"/></g>
  <text x="1475" y="500" text-anchor="middle" class="title">Regularização</text>
  <text x="1475" y="550" text-anchor="middle" class="body"><tspan x="1475">Você apresenta as</tspan><tspan x="1475" dy="24">correções ou documentos</tspan><tspan x="1475" dy="24">necessários e acompanha</tspan><tspan x="1475" dy="24">o processamento.</tspan></text>

  <!-- Arrows -->
  <g fill="none" stroke="#0C9C7B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M325 470h25m-12-12l12 12-12 12"/><path d="M645 470h25m-12-12l12 12-12 12"/><path d="M965 470h25m-12-12l12 12-12 12"/><path d="M1285 470h25m-12-12l12 12-12 12"/></g>

  <!-- Reasons -->
  <rect x="40" y="706" width="1592" height="100" rx="24" fill="url(#mint)"/>
  <line x1="67" y1="727" x2="67" y2="786" stroke="#0C9C7B" stroke-width="4"/>
  <text x="88" y="748" class="label">Motivos comuns:</text><text x="88" y="778" class="small">Situações que podem levar a declaração para análise:</text>
  <g font-family="Arial" font-size="19" fill="#244A66"><text x="625" y="762">omissão de rendimentos</text><text x="875" y="762">despesas médicas</text><text x="1100" y="762">dependentes</text><text x="1335" y="762">dados divergentes</text></g>
  <g stroke="#0C9C7B" stroke-width="4" fill="none"><circle cx="595" cy="753" r="18"/><circle cx="845" cy="753" r="18"/><circle cx="1070" cy="753" r="18"/><rect x="1305" y="735" width="34" height="38" rx="3"/></g>

  <!-- CTA -->
  <rect x="610" y="826" width="452" height="72" rx="36" fill="#0F3557"/>
  <text x="800" y="871" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">Regularize sua situação</text>
  <path d="M1010 862h20m-10-10l10 10-10 10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="50" y="889" font-family="Arial" font-size="14" letter-spacing="4" fill="#31516D">RESODI.COM.BR</text>
</svg>