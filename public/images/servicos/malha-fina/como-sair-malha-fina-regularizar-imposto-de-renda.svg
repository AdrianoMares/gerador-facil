<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Como sair da Malha Fina</title>
  <desc id="desc">Infográfico com o caminho para consultar a pendência, identificar o motivo, corrigir a declaração, enviar retificação ou comprovação e acompanhar a regularização.</desc>
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF8F5"/><stop offset="1" stop-color="#F7FBFC"/></linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#13A37F"/><stop offset="1" stop-color="#0A8E75"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0E3150" flood-opacity="0.09"/></filter>
    <style>
      .navy{fill:#0F3557}.teal{fill:#0C9C7B}.gray{fill:#4E657A}.card{fill:#FFFFFF}.num{fill:#0F3557}.title{font:700 26px Arial,sans-serif;fill:#10385C}.body{font:400 18px Arial,sans-serif;fill:#4E657A}.small{font:400 16px Arial,sans-serif;fill:#4E657A}.label{font:700 20px Arial,sans-serif;fill:#10385C}
    </style>
  </defs>
  <rect width="1672" height="941" fill="#FFFFFF"/>
  <path d="M1435 0h237v140c-77-34-147-43-237-29z" fill="#0F3557"/>
  <path d="M0 856c80-36 173-31 268 85H0z" fill="#0F3557"/>
  <circle cx="1210" cy="86" r="180" fill="#EAF8F5"/>

  <g transform="translate(60 36)">
    <text x="0" y="42" font-family="Arial,sans-serif" font-size="55" font-weight="700" fill="#0F3557">resodi</text>
    <circle cx="183" cy="12" r="7" fill="#0C9C7B"/>
    <line x1="220" y1="0" x2="220" y2="52" stroke="#BFD2DC" stroke-width="2"/>
    <text x="245" y="21" font-family="Arial" font-size="16" fill="#31516D">Mais tranquilidade</text>
    <text x="245" y="43" font-family="Arial" font-size="16" fill="#31516D">para a sua vida fiscal</text>
  </g>

  <text x="60" y="205" font-family="Arial,sans-serif" font-size="70" font-weight="700" fill="#0F3557">Como sair da <tspan fill="#0C9C7B">Malha Fina</tspan></text>
  <text x="62" y="253" font-family="Arial,sans-serif" font-size="27" fill="#4E657A">Veja o caminho para consultar a pendência e regularizar sua declaração.</text>

  <!-- Hero document illustration -->
  <g transform="translate(1160 50) rotate(4)">
    <rect x="0" y="0" width="220" height="230" rx="24" fill="#fff" filter="url(#shadow)"/>
    <text x="110" y="65" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0F3557">Receita Federal</text>
    <rect x="38" y="93" width="128" height="14" rx="7" fill="#D9E3E8"/><rect x="38" y="124" width="110" height="14" rx="7" fill="#D9E3E8"/><rect x="38" y="155" width="92" height="14" rx="7" fill="#D9E3E8"/>
    <circle cx="180" cy="174" r="48" fill="none" stroke="#0C9C7B" stroke-width="9"/><line x1="214" y1="208" x2="247" y2="241" stroke="#0C9C7B" stroke-width="12" stroke-linecap="round"/>
  </g>
  <circle cx="1390" cy="130" r="42" fill="#0C9C7B"/><path d="M1370 130l14 15 29-33" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cards -->
  <g filter="url(#shadow)">
    <rect x="45" y="295" width="280" height="360" rx="28" class="card"/>
    <rect x="365" y="295" width="280" height="360" rx="28" class="card"/>
    <rect x="685" y="295" width="280" height="360" rx="28" class="card"/>
    <rect x="1005" y="295" width="280" height="360" rx="28" class="card"/>
    <rect x="1325" y="295" width="300" height="360" rx="28" class="card"/>
  </g>

  <!-- Step 1 -->
  <circle cx="82" cy="330" r="28" class="num"/><text x="82" y="340" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">1</text>
  <circle cx="185" cy="390" r="64" fill="#EAF8F5"/>
  <g transform="translate(185 390)" fill="none" stroke="#0F3557" stroke-width="8" stroke-linecap="round"><circle cx="-8" cy="-8" r="30"/><line x1="14" y1="14" x2="43" y2="43"/></g>
  <text x="185" y="490" text-anchor="middle" class="title"><tspan x="185">Consultar</tspan><tspan x="185" dy="30">pendência</tspan></text>
  <text x="185" y="552" text-anchor="middle" class="body"><tspan x="185">Consulte a situação da</tspan><tspan x="185" dy="24">declaração e veja as</tspan><tspan x="185" dy="24">pendências apontadas.</tspan></text>

  <!-- Step 2 -->
  <circle cx="402" cy="330" r="28" class="num"/><text x="402" y="340" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">2</text>
  <circle cx="505" cy="390" r="64" fill="#EAF8F5"/>
  <g transform="translate(505 388)" fill="none" stroke="#0F3557" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M0-48L48 40H-48z"/><line x1="0" y1="-17" x2="0" y2="13"/><circle cx="0" cy="28" r="4" fill="#0F3557"/></g>
  <text x="505" y="490" text-anchor="middle" class="title"><tspan x="505">Identificar</tspan><tspan x="505" dy="30">o motivo</tspan></text>
  <text x="505" y="552" text-anchor="middle" class="body"><tspan x="505">Entenda a causa da</tspan><tspan x="505" dy="24">pendência e quais dados</tspan><tspan x="505" dy="24">precisam de atenção.</tspan></text>

  <!-- Step 3 -->
  <circle cx="722" cy="330" r="28" class="num"/><text x="722" y="340" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">3</text>
  <circle cx="825" cy="390" r="64" fill="#EAF8F5"/>
  <g transform="translate(787 350)" fill="none" stroke="#0F3557" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="72" height="92" rx="7"/><line x1="15" y1="25" x2="53" y2="25"/><line x1="15" y1="47" x2="45" y2="47"/><path d="M52 76l27-27 13 13-27 27-17 5z" stroke="#0C9C7B"/></g>
  <text x="825" y="490" text-anchor="middle" class="title"><tspan x="825">Corrigir</tspan><tspan x="825" dy="30">a declaração</tspan></text>
  <text x="825" y="552" text-anchor="middle" class="body"><tspan x="825">Quando houver erro,</tspan><tspan x="825" dy="24">ajuste as informações</tspan><tspan x="825" dy="24">necessárias.</tspan></text>

  <!-- Step 4 -->
  <circle cx="1042" cy="330" r="28" class="num"/><text x="1042" y="340" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">4</text>
  <circle cx="1145" cy="390" r="64" fill="#EAF8F5"/>
  <g transform="translate(1114 346)" fill="none" stroke="#0F3557" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0h48l30 30v70H0z"/><path d="M48 0v30h30"/><line x1="39" y1="75" x2="39" y2="42" stroke="#0C9C7B"/><path d="M25 57l14-15 14 15" stroke="#0C9C7B"/></g>
  <text x="1145" y="490" text-anchor="middle" class="title"><tspan x="1145">Enviar retificação</tspan><tspan x="1145" dy="30">ou comprovação</tspan></text>
  <text x="1145" y="552" text-anchor="middle" class="body"><tspan x="1145">Transmita a retificadora</tspan><tspan x="1145" dy="24">ou apresente documentos,</tspan><tspan x="1145" dy="24">quando aplicável.</tspan></text>

  <!-- Step 5 -->
  <circle cx="1362" cy="330" r="28" class="num"/><text x="1362" y="340" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">5</text>
  <circle cx="1475" cy="390" r="64" fill="#EAF8F5"/>
  <circle cx="1475" cy="390" r="45" fill="#0C9C7B"/><path d="M1453 390l15 16 31-35" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1475" y="490" text-anchor="middle" class="title"><tspan x="1475">Situação</tspan><tspan x="1475" dy="30">regular</tspan></text>
  <text x="1475" y="552" text-anchor="middle" class="body"><tspan x="1475">Acompanhe o processamento</tspan><tspan x="1475" dy="24">até a análise da Receita</tspan><tspan x="1475" dy="24">ser concluída.</tspan></text>

  <!-- Arrows -->
  <g fill="none" stroke="#0C9C7B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M330 455h25m-12-12l12 12-12 12"/><path d="M650 455h25m-12-12l12 12-12 12"/><path d="M970 455h25m-12-12l12 12-12 12"/><path d="M1290 455h25m-12-12l12 12-12 12"/></g>

  <!-- Helper row -->
  <rect x="45" y="685" width="1580" height="110" rx="24" fill="url(#mint)"/>
  <text x="75" y="748" class="label">Você pode precisar:</text>
  <line x1="360" y1="708" x2="360" y2="774" stroke="#B9DDDA" stroke-width="2"/>
  <g font-family="Arial" font-size="20" fill="#244A66"><text x="475" y="750">retificar IRPF</text><text x="760" y="750">enviar documentos</text><text x="1075" y="739">acompanhar</text><text x="1075" y="763">processamento</text><text x="1385" y="750">regularizar pendência</text></g>
  <g stroke="#0F3557" stroke-width="4" fill="none"><rect x="430" y="722" width="30" height="38" rx="3"/><path d="M698 741c0-15 22-15 22 0v19c0 19-29 19-29 0v-21"/><rect x="1015" y="726" width="42" height="28" rx="2"/><line x1="1036" y1="754" x2="1036" y2="764"/><circle cx="1345" cy="738" r="12"/><path d="M1326 770c2-19 36-19 38 0"/></g>

  <!-- CTA -->
  <rect x="605" y="824" width="465" height="72" rx="36" fill="url(#cta)"/>
  <text x="815" y="870" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#fff">Contratar serviço</text>
  <path d="M1010 860h20m-10-10l10 10-10 10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(180 842)"><path d="M0 0l18 8v17c0 14-8 24-18 30-10-6-18-16-18-30V8z" fill="none" stroke="#31516D" stroke-width="3"/><path d="M-7 22l6 6 11-13" fill="none" stroke="#0C9C7B" stroke-width="3"/></g>
  <text x="225" y="855" font-family="Arial" font-size="15" fill="#4E657A">Com o suporte da Resodi,</text><text x="225" y="878" font-family="Arial" font-size="15" fill="#4E657A">seu imposto de renda sem complicação.</text>
</svg>