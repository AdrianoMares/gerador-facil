<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Antes de abrir seu MEI</title>
  <desc id="desc">Checklist com atividade permitida, dados pessoais, conta Gov.br, endereço e forma de atuação, atividade e CNAE e conferência das regras aplicáveis.</desc>
  <rect width="1200" height="675" rx="32" fill="#F4F6F8"/>
  <rect x="70" y="65" width="1060" height="545" rx="28" fill="#FFFFFF" stroke="#DCE3E9" stroke-width="3"/>
  <circle cx="140" cy="135" r="32" fill="#2E9E6F"/><path d="M126 135l10 10 20-22" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="147" fill="#163B63" font-family="Manrope, Arial, sans-serif" font-size="42" font-weight="700">Antes de abrir seu MEI</text>
  <g font-family="Manrope, Arial, sans-serif" font-size="25" fill="#163B63">
    <g><circle cx="145" cy="235" r="13" fill="#2E9E6F"/><text x="180" y="244">Atividade permitida para MEI</text></g>
    <g><circle cx="145" cy="310" r="13" fill="#2E9E6F"/><text x="180" y="319">Dados pessoais e de contato</text></g>
    <g><circle cx="145" cy="385" r="13" fill="#2E9E6F"/><text x="180" y="394">Conta Gov.br no nível necessário</text></g>
    <g><circle cx="625" cy="235" r="13" fill="#2E9E6F"/><text x="660" y="244">Endereço e forma de atuação</text></g>
    <g><circle cx="625" cy="310" r="13" fill="#2E9E6F"/><text x="660" y="319">Atividade principal e CNAE</text></g>
    <g><circle cx="625" cy="385" r="13" fill="#2E9E6F"/><text x="660" y="394">Conferência das regras aplicáveis</text></g>
  </g>
  <rect x="115" y="470" width="970" height="80" rx="15" fill="#EAF6F0"/>
  <text x="600" y="520" text-anchor="middle" fill="#163B63" font-family="Manrope, Arial, sans-serif" font-size="23" font-weight="600">As condições devem ser confirmadas antes da formalização.</text>
</svg>
