      <text x="122" y="310" fill="#0D2742" text-anchor="middle" font-size="25" font-weight="600">Transmitir</text>
      <text x="122" y="344" fill="#52697D" text-anchor="middle" font-size="23">e guardar recibo</text>
    </g>
  </g>
  <rect x="92" y="790" width="1488" height="76" rx="18" fill="#E4F3EC"/>
  <text x="836" y="838" fill="#163B63" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="600">Confira cada informação antes de transmitir pelos canais oficiais.</text>
</svg>
