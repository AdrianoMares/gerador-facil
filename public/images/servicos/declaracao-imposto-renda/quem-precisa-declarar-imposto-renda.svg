      <circle cx="58" cy="58" r="31" fill="#E4F3EC"/>
      <text x="58" y="69" fill="#2E9E6F" text-anchor="middle" font-size="34" font-weight="700">+</text>
      <text x="105" y="62" fill="#0D2742" font-size="26" font-weight="600">Outras hipóteses</text>
      <text x="36" y="118" fill="#52697D" font-size="21">Residência e demais</text>
