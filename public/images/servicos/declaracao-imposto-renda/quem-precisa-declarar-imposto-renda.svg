      <circle cx="58" cy="59" r="31" fill="#E4F3EC"/>
      <path d="m38 73 17-21 13 12 17-29" fill="none" stroke="#2E9E6F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="105" y="62" fill="#0D2742" font-size="26" font-weight="600">Capital e bolsa</text>
      <text x="36" y="117" fill="#52697D" font-size="21">Vendas, ganho de capital</text>
