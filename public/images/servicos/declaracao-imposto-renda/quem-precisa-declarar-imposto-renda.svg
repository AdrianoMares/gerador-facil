<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Quem precisa verificar a obrigatoriedade de declarar Imposto de Renda</title>
  <desc id="desc">Mapa visual dos principais temas de obrigatoriedade: rendimentos, patrimônio, atividade rural, ganho de capital, bolsa, exterior e outras hipóteses.</desc>
  <rect width="1672" height="941" rx="32" fill="#F4F6F8"/>
  <path d="M0 0h1672v174H0z" fill="#0D2742"/>
  <circle cx="1512" cy="86" r="118" fill="#163B63"/>
  <circle cx="1596" cy="22" r="54" fill="#2E9E6F" opacity=".9"/>
  <text x="92" y="78" fill="#B9E3D0" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="600">OBRIGATORIEDADE</text>
  <text x="92" y="129" fill="#FFFFFF" font-family="Manrope,Arial,sans-serif" font-size="43" font-weight="600">Quem precisa verificar se deve declarar?</text>
  <g fill="none" stroke="#B9C9D8" stroke-width="5">
    <path d="M836 478 449 316M836 478 1223 316M836 478 356 562M836 478 1316 562M836 478 519 754M836 478 1153 754"/>
  </g>
