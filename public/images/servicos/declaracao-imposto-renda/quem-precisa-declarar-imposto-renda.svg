      <circle cx="58" cy="59" r="31" fill="#E4F3EC"/>
      <path d="M58 35v48M35 59h46M43 43l30 32M73 43 43 75" stroke="#2E9E6F" stroke-width="5" stroke-linecap="round"/>
      <text x="105" y="62" fill="#0D2742" font-size="26" font-weight="600">Atividade rural</text>
