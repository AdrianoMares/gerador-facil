      <text x="105" y="62" fill="#0D2742" font-size="26" font-weight="600">Rendimentos</text>
      <text x="36" y="117" fill="#52697D" font-size="21">Tributáveis, isentos ou</text>
      <text x="36" y="148" fill="#52697D" font-size="21">tributados na fonte</text>
    </g>
    <g transform="translate(1059 222)">
      <rect width="328" height="188" rx="24" fill="#FFFFFF" stroke="#D5E0E8" stroke-width="3"/>
